<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f0f"/>
  <!-- Red accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#D62828"/>
  <!-- Gold stripes top right -->
  <rect x="1100" y="40" width="80" height="8" fill="#F7B731" rx="2"/>
  <rect x="1100" y="58" width="80" height="8" fill="#F7B731" rx="2"/>
  <rect x="1100" y="76" width="80" height="8" fill="#F7B731" rx="2"/>
  <!-- VARSITY large -->
  <text x="80" y="320" font-family="Arial Black, sans-serif" font-weight="900" font-size="180" fill="#D62828" letter-spacing="-4" opacity="0.15">VARSITY</text>
  <!-- Main wordmark -->
  <text x="80" y="280" font-family="Arial Black, sans-serif" font-weight="900" font-size="130" fill="#ffffff" letter-spacing="-3">VARSITY</text>
  <text x="80" y="420" font-family="Arial Black, sans-serif" font-weight="900" font-size="130" fill="#D62828" letter-spacing="-3">CONTENT</text>
  <!-- Tagline -->
  <text x="82" y="490" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.5)" letter-spacing="6">THE COLLEGIATE ATHLETICS UX INDEX</text>
  <!-- VC badge -->
  <rect x="1020" y="430" width="140" height="140" rx="12" fill="#D62828"/>
  <text x="1090" y="535" font-family="Arial Black, sans-serif" font-weight="900" font-size="80" fill="#ffffff" text-anchor="middle" letter-spacing="-3">VC</text>
</svg>
